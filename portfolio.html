<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joe Marian | Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code&display=swap');

    body {
      margin: 0;
      background-color: #1e1e1e;
      font-family: 'Fira Code', monospace;
      color: #fff;
    }

    .terminal {
      width: 80%;
      max-width: 900px;
      margin: 50px auto;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .terminal-header {
      background: #3c3c3c;
      display: flex;
      align-items: center;
      padding: 6px 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close { background: #ff5f56; }
    .min { background: #ffbd2e; }
    .max { background: #27c93f; }

    .terminal-header span {
      margin: 0 auto;
      color: #ccc;
      font-size: 14px;
    }

    .terminal-body {
      background: #0d0d0d;
      padding: 20px;
      height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .input-line {
      display: flex;
      align-items: center;
    }

    .prompt {
      color: #ffff5f;
      margin-right: 8px;
    }

    .path {
      color: #4fc1ff;
    }

    .user-input {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff00;
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      flex: 1;
      caret-color: #00ff00; /* green blinking caret */
    }

    .command-text {
      color: #00ff00;
    }

    .guest {
      color: orange;
    }

    .highlight {
      color: orange;
      font-weight: bold;
    }

    a {
      color: #4fc1ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="buttons">
        <span class="btn close"></span>
        <span class="btn min"></span>
        <span class="btn max"></span>
      </div>
      <span>Joe Marian Portfolio</span>
    </div>
    <div class="terminal-body" id="terminal">
Welcome to Joe Marian's Portfolio
Terminal Online!

Type 'help' to see all available commands
Click 'tab' for autocompletion
Use 'up' and 'down' arrow keys to navigate command history
<span class="guest"># guest</span> <span class="path">@ ~/joemarian</span>
    </div>
    <div class="input-line">
      <span class="prompt">></span>
      <input type="text" class="user-input" id="input" autofocus />
    </div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");
    const input = document.getElementById("input");

    const commands = {
      help: `Available commands:\n\nhelp      - Show all available commands\nclear     - Clear the terminal\nabout     - About me\nskills    - View my technical skills\nexperience- Internship & work experience\nprojects  - View my projects\ncontact   - Contact information\nresume    - View my resume`,

      about: `<span class="highlight">Name:</span> Joe Marian A\n<span class="highlight">Education:</span> B.Tech CSE with IoT Specialisation - Shiv Nadar University, Chennai\n\nI am passionate about technology, problem-solving, and building end-to-end projects.\nI love football, cricket, and Formula 1, and in my free time, I enjoy playing, coding, and experimenting with new tools to create innovative solutions.`,

      skills: `<span class="highlight">Languages:</span> Python, Java, C, SQL (Postgres), JavaScript, HTML/CSS, MATLAB\n<span class="highlight">Frameworks:</span> ReactJS, Vite, MERN, Flask, Django, Pandas, Tensorflow, Streamlit, Numpy, PyTorch, Keras\n<span class="highlight">Databases:</span> MySQL, SQLite, PostgreSQL, MongoDB\n<span class="highlight">Developer Tools:</span> GitHub, BitBucket, Jira, Gitbash, VS Code, Anaconda, Eclipse\n<span class="highlight">Coursework:</span> IoT, Embedded Systems, ML, AI, AWS, Containerization, Full Stack, RAG, LLM, AIoT, Deep Learning, DevOps\n<span class="highlight">Certifications:</span> Meta Front-End Developer, IIoT, Cloud Computing, IBM AI Developer, BCG Data Science`,

      experience: `<span class="highlight">Summer Intern | Wadhwani School of Data Science & AI, IIT Madras (2025)</span>\n- Built secure IoT architecture using FastAPI, Docker, MongoDB, VPS, Cloudflare, React, and ML analytics.\n\n<span class="highlight">Research Intern | IIIT Kottayam (2024)</span>\n- Developed a multi-objective controller placement model in SDN using Krill Herd Algorithm, boosting performance & cutting costs by 20%.\n\n<span class="highlight">Web Developer Intern | Nexus Info. (2024)</span>\n- Created a software company website using MERN, improving data retrieval speed by 30%.`,

      projects: `<span class="highlight">Federated Learning Psych Bot</span>\n- Mental health assistant using LLM + Federated Learning, deployed with FastAPI & Streamlit.\n\n<span class="highlight">FinBot - Personal Finance Chatbot</span>\n- AI chatbot predicting savings, EMI, budgets with 90%+ accuracy. Integrated ML forecasting.\n\n<span class="highlight">PharmaVision</span>\n- End-to-end data analytics & ML platform with automated ETL, anomaly detection, forecasting, BI dashboards.\n\n<span class="highlight">Other Projects:</span> PulseRide (EV Ride App), StackSage (Tech Q/A Bot)`,

      contact: `Email: <a href=\"mailto:joemarian3010@gmail.com\">joemarian3010@gmail.com</a>\nLinkedIn: <a href=\"https://www.linkedin.com/in/joemariana/\" target=\"_blank\">linkedin.com/in/joemariana</a>\nGitHub:   <a href=\"https://github.com/JoeMarian\" target=\"_blank\">github.com/JoeMarian</a>`,

      resume: `Opening resume...\n\n<a href=\"https://drive.google.com/file/d/1B13gRevH7iLQyOR55T_kFm4A4g8BzI5r/view?usp=drive_link\" target=\"_blank\">View Resume</a>`
    };

    let history = [];
    let historyIndex = -1;

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        const cmd = input.value.trim();
        if (cmd === "") return;

        history.push(cmd);
        historyIndex = history.length;

        let output = "Command not found";
        if (commands[cmd]) output = commands[cmd];
        if (cmd === "clear") {
          terminal.innerHTML = "";
          input.value = "";
          return;
        }

        terminal.innerHTML += `\n<span class="command-text">> ${cmd}</span>\n${output}\n<span class="guest"># guest</span> <span class="path">@ ~/joemarian</span>`;
        terminal.scrollTop = terminal.scrollHeight;
        input.value = "";
      }

      // Tab autocompletion
      if (event.key === "Tab") {
        event.preventDefault();
        const cmd = input.value.trim();
        const matches = Object.keys(commands).filter(c => c.startsWith(cmd));
        if (matches.length === 1) {
          input.value = matches[0];
        }
      }

      // Command history navigation
      if (event.key === "ArrowUp") {
        if (historyIndex > 0) {
          historyIndex--;
          input.value = history[historyIndex];
        }
      }
      if (event.key === "ArrowDown") {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          input.value = history[historyIndex];
        } else {
          historyIndex = history.length;
          input.value = "";
        }
      }
    });
  </script>
</body>
</html>
